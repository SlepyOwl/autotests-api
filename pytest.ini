[pytest]
addopts = -s -v
python_files = test_*.py *_test.py

python_classes = Test*

python_functions = test_*
markers=
    users: Маркировка для тестов, связанных с пользователями.
    files: Маркировка для тестов, связанных с файлами.
    courses: Маркировка для тестов, связаных с курсами.
    regression: Маркировка для регессионных тестов.
    authentication: Маркировка для аутефикационных тестов.